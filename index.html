<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Creator</title>
    <style>
        #bulk-action-bar {
            display: none;
            padding: 10px;
            background-color: #f1f1f1;
            border: 1px solid #ccc;
            position: fixed;
            bottom: 10px;
            right: 10px;
        }
    </style>
</head>
<body>
    <div id="item-container">
        <!-- Items will go here -->
    </div>
    <div id="bulk-action-bar">
        <span id="selected-count">0 selected</span>
        <button id="reset-button">Reset</button>
        <button id="delete-button">Delete</button>
    </div>
    <script>
        let selectedItems = new Set();
        let timeout;

        document.querySelectorAll('.item').forEach(item => {
            item.addEventListener('mousedown', (event) => {
                timeout = setTimeout(() => {
                    item.classList.toggle('selected');
                    updateSelection(item);
                }, 500);
            });

            item.addEventListener('mouseup', () => {
                clearTimeout(timeout);
            });

            item.addEventListener('mouseleave', () => {
                clearTimeout(timeout);
            });
        });

        function updateSelection(item) {
            if (item.classList.contains('selected')) {
                selectedItems.add(item.dataset.id);
            } else {
                selectedItems.delete(item.dataset.id);
            }
            updateBulkActionBar();
        }

        function updateBulkActionBar() {
            const count = selectedItems.size;
            document.getElementById('selected-count').innerText = `${count} selected`;
            document.getElementById('bulk-action-bar').style.display = count ? 'block' : 'none';
        }

        document.getElementById('reset-button').addEventListener('click', () => {
            document.querySelectorAll('.item.selected').forEach(item => {
                item.classList.remove('selected');
            });
            selectedItems.clear();
            updateBulkActionBar();
        });

        document.getElementById('delete-button').addEventListener('click', () => {
            // Logic to delete selected items
            alert('Delete action triggered for selected items');
        });
    </script>
</body>
</html>
