<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery List</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-4">
        <h1 class="text-2xl font-bold mb-4">Grocery List</h1>
        <div id="grocery-items" class="grid grid-cols-1 gap-4"></div>
        <div class="fixed bottom-0 left-0 right-0 bg-gray-800 p-4 flex justify-between">
            <button id="reset" class="bg-red-500 text-white p-2 rounded">Reset</button>
            <button id="delete" class="bg-blue-500 text-white p-2 rounded">Delete</button>
        </div>
    </div>
    <script>
        let selectedItems = [];
        const groceryItemsContainer = document.getElementById('grocery-items');

        function longPressAction(item) {
            setTimeout(() => {
                if (selectedItems.includes(item)) {
                    selectedItems = selectedItems.filter(i => i !== item);
                } else {
                    selectedItems.push(item);
                }
                updateItemSelection();
            }, 500);
        }

        function updateItemSelection() {
            // Logic to update the display of selected items
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Logic to populate grocery items and add event listeners here
            groceryItemsContainer.innerHTML = '<div class="item" onmousedown="longPressAction(1)">Item 1</div>';
            // ...add more items
        });

        document.getElementById('reset').addEventListener('click', () => {
            selectedItems = [];
            updateItemSelection();
        });

        document.getElementById('delete').addEventListener('click', () => {
            // Logic to delete selected items
        });
    </script>
</body>
</html>
